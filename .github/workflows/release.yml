name: Release models

# Builds the models from BodyParts3D and publishes them as assets of the GitHub Release v<VERSION>.
# Runs when VERSION changes on main (bump it to publish), or by hand. An existing release is never overwritten.
on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Version
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(tr -d '[:space:]' < VERSION)
          echo "tag=v$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" >/dev/null 2>&1; then echo "exists=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.v.outputs.exists != 'true'
        uses: actions/cache@v4
        with:
          path: bp3d
          key: bp3d-${{ hashFiles('pipeline/bp3d.sha256') }}
      - if: steps.v.outputs.exists != 'true'
        name: Build
        run: |
          pip install -r pipeline/requirements.txt
          npm install --no-save gltf-validator@2.0.0-dev.3.10
          pipeline/fetch_bp3d.sh bp3d
          python pipeline/build.py bp3d build
          python pipeline/check.py build/upper_limb.json build/full_body.json
          node pipeline/validate_gltf.js build/upper_limb.glb build/full_body.glb
          cp LICENSE CREDITS.md LICENSES/CC-BY-SA-2.1-JP.txt build/
          (cd build && sha256sum *.glb *.json > SHA256SUMS)
      - if: steps.v.outputs.exists != 'true'
        name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          {
            echo "Modèles 3D Anatomo $TAG, construits par \`pipeline/build.py\` depuis $GITHUB_SHA."
            echo
            echo "BodyParts3D, © The Database Center for Life Science, licensed under CC Attribution-Share Alike 2.1 Japan."
            echo "Modèles dérivés sous la même licence (CC BY-SA 2.1 JP) : voir LICENSE et CREDITS.md."
            echo
            echo '```'
            python pipeline/check.py build/upper_limb.json build/full_body.json
            echo '```'
          } > notes.md
          gh release create "$TAG" --target "$GITHUB_SHA" --title "Modèles $TAG" --notes-file notes.md \
            build/upper_limb.glb build/upper_limb.json build/upper_limb.landmarks.json \
            build/full_body.glb build/full_body.json \
            build/SHA256SUMS build/LICENSE build/CREDITS.md build/CC-BY-SA-2.1-JP.txt

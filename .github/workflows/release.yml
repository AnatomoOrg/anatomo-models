name: Release models

# Builds the models from BodyParts3D (and the Open3DModel nerves of the limbs) and publishes them as assets of the GitHub Release v<VERSION>.
# Runs when VERSION changes on main (bump it to publish), or by hand on main. An existing release is never overwritten.
on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    # Only main publishes: a release cut from another branch would block the real one (releases are never overwritten).
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      exists: ${{ steps.v.outputs.exists }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Version
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          v=$(tr -d '[:space:]' < VERSION)
          echo "tag=v$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" -R "$REPO" >/dev/null 2>&1; then echo "exists=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.v.outputs.exists != 'true'
        uses: actions/cache@v4
        with:
          path: bp3d
          key: bp3d-${{ hashFiles('pipeline/bp3d.sha256', 'pipeline/open3d.sha256') }}
      - if: steps.v.outputs.exists != 'true'
        name: Build
        run: |
          pip install -r pipeline/requirements.txt
          npm install --no-save gltf-validator@2.0.0-dev.3.10
          pipeline/fetch_bp3d.sh bp3d
          pipeline/fetch_open3d.sh bp3d/open3d
          python pipeline/build.py bp3d build
          python pipeline/check.py build/upper_limb.json build/full_body.json | tee build/check.txt
          node pipeline/validate_gltf.js build/upper_limb.glb build/full_body.glb
          cp LICENSE CREDITS.md LICENSES/CC-BY-SA-2.1-JP.txt LICENSES/CC-BY-SA-4.0.txt build/
          # Mirror of the pinned Open3DModel sources (their upstream URLs are not versioned), published with the release:
          # pipeline/fetch_open3d.sh tries it before the upstream URL.
          cp bp3d/open3d/upper-limb-obj.zip bp3d/open3d/lower-limb-obj.zip build/
          (cd build && sha256sum *.glb *.json upper-limb-obj.zip lower-limb-obj.zip > SHA256SUMS)
      - if: steps.v.outputs.exists != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: models
          path: build/
          retention-days: 7

  publish:
    # Separate job: the write token never sees the dependency installs or the downloaded data.
    needs: build
    if: needs.build.outputs.exists != 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: models
          path: build
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          {
            echo "Modèles 3D Anatomo $TAG, construits par \`pipeline/build.py\` depuis $GITHUB_SHA."
            echo
            echo "BodyParts3D, © The Database Center for Life Science, licensed under CC Attribution-Share Alike 2.1 Japan (https://creativecommons.org/licenses/by-sa/2.1/jp/)."
            echo "Nerfs du membre supérieur : \"Open3DModel - Upper limb - English labels\" at AnatomyTOOL.org by Open3D project, Jan Kooloos, RadboudUMC, Eungyeol Lee, LUMC et al, license: Creative Commons Attribution-ShareAlike (https://creativecommons.org/licenses/by-sa/4.0/)."
            echo "Nerfs du membre inférieur (full_body) : \"Open3DModel - Lower limb - English labels\" at AnatomyTOOL.org by Open3D project, Jan Kooloos, RadboudUMC, Eungyeol Lee, LUMC et al, license: Creative Commons Attribution-ShareAlike (https://creativecommons.org/licenses/by-sa/4.0/)."
            echo "upper_limb et full_body : CC BY-SA 4.0. Voir LICENSE et CREDITS.md."
            echo "upper-limb-obj.zip, lower-limb-obj.zip : copies non modifiées des sources Open3DModel (exports OBJ, géométrie seule, CC BY-SA 4.0), épinglées par pipeline/open3d.sha256."
            echo
            echo '```'
            cat build/check.txt
            echo '```'
          } > notes.md
          cd build
          gh release create "$TAG" -R "$REPO" --target "$GITHUB_SHA" --title "Modèles $TAG" --notes-file ../notes.md \
            upper_limb.glb upper_limb.json upper_limb.landmarks.json full_body.glb full_body.json full_body.landmarks.json \
            SHA256SUMS LICENSE CREDITS.md CC-BY-SA-2.1-JP.txt CC-BY-SA-4.0.txt upper-limb-obj.zip lower-limb-obj.zip
